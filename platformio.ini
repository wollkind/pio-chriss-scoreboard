; pio-chriss-scoreboard: live fantasy football points on the Waveshare ESP32-S3-RGB-Matrix + 64x64 HUB75 panel.
; Board settings are copied from infopanel64 (verified on this hardware).

[env:esp32s3]
; Arduino-ESP32 3.3.x is only available through the pioarduino platform fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3-N32R16: 32 MB flash + 16 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304

; The vendored HUB75 driver #includes platforms/esp32s3/gdma_lcd_parallel16.cpp itself,
; so keep that folder out of the build or its symbols are defined twice.
build_src_filter = +<*> -<platforms/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7

; Over-the-air upload to a panel already running this firmware:
;   PowerShell:  $env:SCOREBOARD_OTA_PASSWORD = "..."   (same as OTA_PASSWORD in secrets.h)
;   pio run -e esp32s3-ota -t upload
; In VS Code: PlatformIO sidebar -> esp32s3-ota -> Upload.
; If scoreboard.local doesn't resolve, add:  --upload-port <panel IP>
; This environment builds in its own folder, so its first build compiles everything once.
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = scoreboard.local
upload_flags =
    --port=3232
    --auth=${sysenv.SCOREBOARD_OTA_PASSWORD}
